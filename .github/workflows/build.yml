name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
            vst3: build/NanoFrog_artefacts/Release/VST3/NanoFrog.vst3
            standalone: build/NanoFrog_artefacts/Release/Standalone/NanoFrog
          - os: macos-14
            label: macOS
            vst3: build/NanoFrog_artefacts/Release/VST3/NanoFrog.vst3
            standalone: build/NanoFrog_artefacts/Release/Standalone/NanoFrog.app
          - os: windows-2022
            label: Windows
            vst3: build/NanoFrog_artefacts/Release/VST3/NanoFrog.vst3
            standalone: build/NanoFrog_artefacts/Release/Standalone/NanoFrog.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            ccache xvfb libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxinerama-dev libxrandr-dev libfreetype6-dev libfontconfig1-dev \
            libcurl4-openssl-dev libwebkit2gtk-4.1-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: ccache cache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Self-test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/NanoFrogHeadlessTest_artefacts/Release/NanoFrogHeadlessTest

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: ./build/NanoFrogHeadlessTest_artefacts/Release/NanoFrogHeadlessTest

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        run: build\NanoFrogHeadlessTest_artefacts\Release\NanoFrogHeadlessTest.exe

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: NanoFrog-${{ matrix.label }}-VST3
          path: ${{ matrix.vst3 }}

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: NanoFrog-${{ matrix.label }}-Standalone
          path: ${{ matrix.standalone }}

  release:
    name: Auto-release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip bundles and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          for d in NanoFrog-*/; do
            n="${d%/}"
            (cd "$n" && zip -qr "../${n}.zip" .)
          done
          ls *.zip
          # Evergreen "auto" tag: replace the previous auto release.
          gh release delete auto --cleanup-tag --yes 2>/dev/null || true
          git push origin :refs/tags/auto 2>/dev/null || true
          gh release create auto --repo "${{ github.repository }}" \
            --title "Auto build" \
            --notes "Automated CI build from ${{ github.sha }}. Personal project, provided as-is without warranty." \
            *.zip
